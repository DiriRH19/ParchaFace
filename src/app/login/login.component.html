<div class="login-container">
  <div class="back-link">
    <a routerLink="/">
      <span>←</span> Volver al inicio
    </a>
  </div>
  <div class="login-card">
    <div class="logo-section">
      <img src="https://res.cloudinary.com/dgaxlowpd/image/upload/v1765764539/logoParchaFace_fzz8sh.png" alt="ParchaFace Logo" class="logo-img">
    </div>
    <h1 class="welcome-title">¡Bienvenido de vuelta!</h1>
    <p class="welcome-subtitle">Inicia sesión para descubrir eventos increíbles</p>
    <form class="login-form">
      <div class="form-group">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" placeholder="tu@email.com" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <div class="password-input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" placeholder="Tu contraseña" class="form-input">
          <button type="button" class="toggle-password" (click)="togglePassword()">{{ showPassword ? 'Ocultar' : 'Mostrar' }}</button>
        </div>
      </div>
      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" class="checkbox">
          <span>Recordarme</span>
        </label>
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>
      <button type="submit" class="btn-login">Iniciar Sesión</button>
      <div class="divider">
        <span>O continúa con</span>
      </div>
      <div class="social-buttons">
        <button type="button" class="social-btn google">
          <span>G</span> Google
        </button>
        <button type="button" class="social-btn twitter">
          Twitter
        </button>
      </div>
      <div class="register-link">
        <span>¿No tienes cuenta?</span>
        <a routerLink="/register" class="link">Regístrate aquí</a>
      </div>
    </form>
  </div>
</div>
