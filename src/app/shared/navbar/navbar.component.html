<header class="navbar">
  <div class="navbar-content">
    <div class="navbar-left">
      <a routerLink="/" class="logo">
        <div class="logo-icon"></div>
        <span class="logo-text">ParchaFace</span>
      </a>
      <nav class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
        <a routerLink="/explore" routerLinkActive="active">Explorar</a>
        <a routerLink="/community" routerLinkActive="active">Comunidad</a>
      </nav>
    </div>
    <div class="navbar-right">
      <button class="btn-create-event" (click)="onCreateEventClick()">
        <span>+</span> Crear Evento
      </button>
      <a routerLink="/profile" class="user-menu">
        <div class="notification-icon"></div>
        <div class="user-avatar"></div>
        <span class="user-name">Juan Pérez</span>
      </a>
    </div>
  </div>
</header>
