<div class="event-card">
  <div class="event-image">
    <!-- Imagen real -->
    <img
      *ngIf="imageOk && normalizedEvent.imageUrl"
      [src]="normalizedEvent.imageUrl"
      alt="Portada"
      loading="lazy"
      class="event-img"
      (error)="onImgError()"
    >

    <!-- Placeholder cuando no hay imagen o falla -->
    <div *ngIf="!imageOk || !normalizedEvent.imageUrl" class="event-img-placeholder">
      🖼️ Portada
    </div>

    <span class="category-tag">{{ normalizedEvent.category || 'Sin categoría' }}</span>

    <div class="action-icons">
      <button type="button" class="icon-btn heart" aria-label="Me gusta"></button>
      <button type="button" class="icon-btn share" aria-label="Compartir"></button>
    </div>

    <div class="rating-badge">
      {{ normalizedEvent.rating }}
    </div>
  </div>

  <div class="event-content">
    <h3 class="event-title">{{ normalizedEvent.title }}</h3>
    <p class="event-description">{{ normalizedEvent.description }}</p>

    <div class="event-details">
      <div class="detail-item">
        <span class="icon"></span>
        <span>{{ normalizedEvent.date }}</span>
      </div>
      <div class="detail-item">
        <span class="icon"></span>
        <span>{{ normalizedEvent.location }}</span>
      </div>
      <div class="detail-item">
        <span class="icon"></span>
        <span>{{ normalizedEvent.attendees }}</span>
      </div>
    </div>

    <div class="event-footer">
      <div class="price">{{ normalizedEvent.price }}</div>

      <button
        class="btn-details"
        [routerLink]="['/event', normalizedEvent.id ?? 1]"
        type="button"
      >
        Ver Detalles
      </button>
    </div>
  </div>
</div>
