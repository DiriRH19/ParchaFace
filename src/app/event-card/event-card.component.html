<div class="event-card">
  <div class="event-image">
    <span class="category-tag">{{ event.category }}</span>

    <img
      *ngIf="event.imageUrl"
      [src]="event.imageUrl"
      alt="Portada"
      class="event-img"
      loading="lazy"
      (error)="onImgError()"
    >

    <div class="action-icons">
      <button class="icon-btn heart" type="button"></button>
      <button class="icon-btn share" type="button"></button>
    </div>

    <div class="rating-badge">
      {{ event.rating }}
    </div>
  </div>

  <div class="event-content">
    <h3 class="event-title">{{ event.title }}</h3>
    <p class="event-description">{{ event.description }}</p>

    <div class="event-details">
      <div class="detail-item">
        <span class="icon"></span>
        <span>{{ event.date }}</span>
      </div>

      <div class="detail-item">
        <span class="icon"></span>
        <span>{{ event.location }}</span>
      </div>

      <div class="detail-item" *ngIf="event.ciudad">
        <span class="icon">🌤️</span>

        <span *ngIf="climaLoading">Clima...</span>

        <span *ngIf="!climaLoading && clima">
          {{ clima.temperaturaC }} °C • 💨 {{ clima.vientoKmh }} km/h
        </span>

        <span *ngIf="!climaLoading && !clima && climaError">
          Clima no disponible
        </span>
      </div>

      <div class="detail-item">
        <span class="icon"></span>
        <span>{{ event.attendees }}</span>
      </div>
    </div>

    <div class="event-footer">
      <div class="price">{{ event.price }}</div>

      <a
        class="btn-details"
        [routerLink]="event.id != null ? ['/event', event.id] : ['/explore']"
        [class.disabled]="event.id == null"
      >
        Ver Detalles
      </a>

    </div>
  </div>
</div>
