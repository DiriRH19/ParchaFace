<div class="event-card">
  <div class="event-image">
    <span class="category-tag">{{ event.category }}</span>
    <img *ngIf="event.imageUrl" [src]="event.imageUrl" alt="Portada" class="event-img">
    <div class="action-icons">
      <button class="icon-btn heart"></button>
      <button class="icon-btn share"></button>
    </div>
    <div class="rating-badge">
      {{ event.rating }}
    </div>
  </div>
  <div class="event-content">
    <h3 class="event-title">{{ event.title }}</h3>
    <p class="event-description">{{ event.description }}</p>
    <div class="event-details">
      <div class="detail-item">
        <span class="icon"></span>
        <span>{{ event.date }}</span>
      </div>
      <div class="detail-item">
        <span class="icon"></span>
        <span>{{ event.location }}</span>
      </div>
      <div class="detail-item">
        <span class="icon"></span>
        <span>{{ event.attendees }}</span>
      </div>
    </div>
    <div class="event-footer">
      <div class="price">{{ event.price }}</div>
      <button class="btn-details" routerLink="/event/1">Ver Detalles</button>
    </div>
  </div>
</div>
