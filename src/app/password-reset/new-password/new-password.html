<div class="page">
  <!-- top-left link -->
  <a class="back-link" routerLink="/login">
    <span class="arrow">←</span> Volver al inicio
  </a>

  <div class="card">
    <div class="logo-wrap">
        <img src="https://res.cloudinary.com/dgaxlowpd/image/upload/v1765764539/logoParchaFace_fzz8sh.png" alt="ParchaFace" />
    </div>

    <h1>Nueva contraseña</h1>
    <p class="subtitle">Crea una contraseña nueva para tu cuenta.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <!-- NUEVA -->
      <div class="field">
        <label>Nueva contraseña</label>

        <div class="input-wrap">
          <input
            [type]="showNew ? 'text' : 'password'"
            formControlName="nuevaContrasena"
            placeholder="Nueva contraseña"
          />
          <button type="button" class="toggle" (click)="toggleNew()">
            {{ showNew ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>

        <small class="hint error" *ngIf="nuevaContrasena?.touched && nuevaContrasena?.invalid">
          <span *ngIf="nuevaContrasena?.errors?.['required']">La contraseña es obligatoria.</span>
          <span *ngIf="nuevaContrasena?.errors?.['minlength']">Mínimo 6 caracteres.</span>
        </small>
      </div>

      <!-- CONFIRMAR -->
      <div class="field">
        <label>Confirmar contraseña</label>

        <div class="input-wrap">
          <input
            [type]="showConfirm ? 'text' : 'password'"
            formControlName="confirmarContrasena"
            placeholder="Confirmar contraseña"
          />
          <button type="button" class="toggle" (click)="toggleConfirm()">
            {{ showConfirm ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>

        <small class="hint error" *ngIf="confirmarContrasena?.touched && confirmarContrasena?.invalid">
          <span *ngIf="confirmarContrasena?.errors?.['required']">Debes confirmar la contraseña.</span>
        </small>
      </div>

      <!-- MENSAJES -->
      <div class="alert ok" *ngIf="msg">{{ msg }}</div>
      <div class="alert err" *ngIf="error">{{ error }}</div>

      <!-- BOTÓN CONTINUAR -->
      <button class="btn" type="submit" [disabled]="loading">
        {{ loading ? 'Guardando...' : 'Continuar' }}
      </button>

      <!-- links abajo -->
      <div class="bottom-links">
        <a routerLink="/forgot-password">Volver a enviar correo</a>
        <span class="dot">•</span>
        <a routerLink="/verify-code">Volver a código</a>
      </div>
    </form>
  </div>
</div>
