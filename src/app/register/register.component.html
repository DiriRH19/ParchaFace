<div class="register-container">
  <div class="back-link">
    <a routerLink="/">
      <span>←</span> Volver al inicio
    </a>
  </div>
  <div class="register-card">
    <div class="logo-section">
      <div class="logo">ParchaFace</div>
    </div>
    <h1 class="register-title">¡Únete a ParchaFace!</h1>
    <p class="register-subtitle">Crea tu cuenta y comienza a descubrir eventos increíbles</p>
    <form class="register-form">
      <div class="form-group">
        <label class="form-label">Nombre Completo</label>
        <input type="text" placeholder="Tu nombre completo" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" placeholder="tu@email.com" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <div class="password-input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" placeholder="Mínimo 8 caracteres" class="form-input">
          <button type="button" class="toggle-password" (click)="togglePassword()"></button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirmar Contraseña</label>
        <div class="password-input-wrapper">
          <input [type]="showConfirmPassword ? 'text' : 'password'" placeholder="Repite tu contraseña" class="form-input">
          <button type="button" class="toggle-password" (click)="toggleConfirmPassword()"></button>
        </div>
      </div>
      <div class="form-checkboxes">
        <label class="checkbox-label">
          <input type="checkbox" class="checkbox">
          <span>Acepto los <a href="#" class="link">términos y condiciones</a> y la <a href="#" class="link">política de la privacidad</a></span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" class="checkbox">
          <span>Quiero recibir notificaciones sobre eventos y novedades de ParchaFace</span>
        </label>
      </div>
      <button type="submit" class="btn-register">Crear Cuenta</button>
      <div class="divider">
        <span>O regístrate con</span>
      </div>
      <div class="social-buttons">
        <button type="button" class="social-btn google">
          <span>G</span> Google
        </button>
        <button type="button" class="social-btn twitter">
          Twitter
        </button>
      </div>
      <div class="login-link">
        <span>¿Ya tienes cuenta?</span>
        <a routerLink="/login" class="link">Inicia sesión aquí</a>
      </div>
    </form>
  </div>
</div>
